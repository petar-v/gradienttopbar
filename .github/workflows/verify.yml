name: Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint and schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn validate-schemas

  shexli:
    name: Shexli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn setup-python
      - run: yarn shexli
